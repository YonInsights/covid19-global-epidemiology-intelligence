[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "covid19-global-epidemiology-intelligence"
version = "1.0.0"
description = "Global epidemiological intelligence platform analyzing COVID-19 pandemic dynamics, case fatality rates, and unsupervised healthcare risk clustering."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Portfolio Project", email = "portfolio@example.com" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
